appId: com.helm.app
productName: Helm
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!assets/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # resources/libreoffice ships solely via extraResources below (read at runtime
  # from process.resourcesPath, never from app.asar/app.asar.unpacked — see
  # bundledSofficeCandidates in src/main/mediaImport.ts). Without this exclusion
  # the tree also gets packed as app files and duplicated under
  # resources/app.asar.unpacked/resources/libreoffice, doubling installer size
  # for a copy the app never reads.
  - '!resources/libreoffice'
  - '!resources/libreoffice/**'
asarUnpack:
  - resources/**
# resources/libreoffice is a vendored, per-OS LibreOffice-headless tree kept OUTSIDE git
# (large). It MUST be staged on the build machine before build:win / build:mac. If the
# folder is absent the build still succeeds but PPTX import degrades to the
# no-libreoffice fallback modal at runtime.
extraResources:
  - from: resources/bibles
    to: bibles
  - from: resources/libreoffice
    to: libreoffice
win:
  executableName: Helm
nsis:
  artifactName: Helm-Setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
publish:
  provider: github
  owner: chase-codes
  repo: helm
  releaseType: draft
mac:
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: Helm
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
