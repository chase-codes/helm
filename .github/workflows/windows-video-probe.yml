name: Windows video probe
# Drives the real operator UI (import a video → Play → Go live → Play) under Playwright and
# records what the <video> elements, the helm-media:// handler and main's video state do.
# Exists because imported video sits on its first frame on Windows and nobody has a
# Windows machine to look at; see scripts/probe-video-playback.mjs.
# Two legs per OS: the unpackaged build (node_modules Electron + out/), then the same
# flow against an electron-builder --dir package (asar, app.isPackaged, resourcesPath),
# which is as close to the NSIS install as a runner gets.
on:
  workflow_dispatch:
  # TEMPORARY: push trigger for the fix/windows-video-playback investigation only.
  # Remove it (keep workflow_dispatch) before or when that branch merges.
  push:
    branches: [fix/windows-video-playback]

permissions:
  contents: read

jobs:
  probe:
    name: probe (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            builder: --win
            exe: dist/win-unpacked/Helm.exe
          # macos-14 is the control: the same flow is known to pass there.
          - os: macos-14
            builder: --mac --arm64
            exe: dist/mac-arm64/Helm.app/Contents/MacOS/Helm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # No vendor-deps step: video never touches LibreOffice, and resources/bibles/kjv.json
      # is checked in — enough for the unpackaged build and for the package below.
      - run: npx electron-vite build

      - name: Download test videos
        run: |
          mkdir -p "$RUNNER_TEMP/probe-videos"
          fetch() {
            local out="$RUNNER_TEMP/probe-videos/$1"
            curl --fail --silent --show-error --location --retry 3 --retry-delay 5 --max-time 300 -o "$out" "$2"
            # A CDN error page saved as .mp4 would make the probe fail for the wrong reason.
            node -e '
              const fs = require("fs");
              const f = process.argv[1];
              const size = fs.statSync(f).size;
              const head = Buffer.alloc(12);
              fs.readSync(fs.openSync(f, "r"), head, 0, 12, 0);
              const brand = head.toString("latin1", 4, 8);
              if (brand !== "ftyp" || size < 100000) {
                console.error(`::error::${f} is not a real mp4 (size=${size}, bytes 4-8=${JSON.stringify(brand)})`);
                process.exit(1);
              }
              console.log(`ok ${f} ${size} bytes`);
            ' "$out"
          }
          # ~1 MB, 5s, H.264 + AAC, faststart.
          fetch flower.mp4 https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4
          # ~30 MB, 10s, 1080p H.264, no audio: forces real range requests.
          fetch bbb-1080-30mb.mp4 https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/1080/Big_Buck_Bunny_1080_10s_30MB.mp4

      # The hosted Windows runner has an interactive desktop session, so Electron needs no
      # xvfb-style wrapper or extra flags. It has no GPU, though: video decodes in software
      # here, so a hardware-decode-only failure on a real machine would not reproduce.
      - name: Probe playback
        env:
          PROBE_OUT: ${{ runner.temp }}/probe-out
        run: |
          mkdir -p "$PROBE_OUT"
          node scripts/probe-video-playback.mjs \
            "$RUNNER_TEMP/probe-videos/flower.mp4" \
            "$RUNNER_TEMP/probe-videos/bbb-1080-30mb.mp4" 2>&1 | tee "$PROBE_OUT/probe.log"

      # Packaged leg. always(): a FAIL above must not hide this result, or the reverse.
      # Same packaging as release.yml minus the installer: npm ci's postinstall
      # (electron-builder install-app-deps) already built better-sqlite3 and
      # @napi-rs/canvas for Electron, and npmRebuild: false ships them as-is. --dir stops
      # at the unpacked app the NSIS installer would wrap. electron-builder only warns
      # about a missing extraResources source, but an empty resources/libreoffice costs
      # nothing and takes the question away; the app then shows its no-LibreOffice
      # fallback, which video import never reaches.
      - name: Package (unpacked)
        id: package
        if: always()
        run: |
          mkdir -p resources/libreoffice
          npx electron-builder ${{ matrix.builder }} --dir --publish never
          ls -la "$(dirname "${{ matrix.exe }}")"

      # The probe passes --host-resolver-rules to a packaged app so its auto-updater
      # (on whenever app.isPackaged) can't reach GitHub; see probe-video-playback.mjs.
      - name: Probe playback (packaged)
        if: always() && steps.package.outcome == 'success'
        env:
          PROBE_OUT: ${{ runner.temp }}/probe-out-packaged
          PROBE_APP_EXE: ${{ matrix.exe }}
        run: |
          mkdir -p "$PROBE_OUT"
          node scripts/probe-video-playback.mjs \
            "$RUNNER_TEMP/probe-videos/flower.mp4" \
            "$RUNNER_TEMP/probe-videos/bbb-1080-30mb.mp4" 2>&1 | tee "$PROBE_OUT/probe.log"

      - name: Summarise verdicts
        if: always()
        run: |
          {
            echo "### Video probe — ${{ matrix.os }}"
            for leg in probe-out probe-out-packaged; do
              echo "**$leg**"
              echo '```'
              grep -m1 -E '^platform:' "$RUNNER_TEMP/$leg/probe.log" 2>/dev/null || true
              cat "$RUNNER_TEMP/$leg/verdicts.txt" 2>/dev/null || echo "no verdicts written — see the probe log"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-probe-${{ matrix.os }}
          path: ${{ runner.temp }}/probe-out
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-probe-packaged-${{ matrix.os }}
          path: ${{ runner.temp }}/probe-out-packaged
          if-no-files-found: warn
          retention-days: 14
